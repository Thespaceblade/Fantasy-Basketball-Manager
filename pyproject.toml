[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-basketball-manager"
version = "0.1.0"
description = "ESPN fantasy basketball tools and an agent skill powered by API Anything"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
fbm = "fantasy_basketball_manager.cli:main"
fbm-mcp = "fantasy_basketball_manager.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fantasy_basketball_manager = ["operations.json"]
